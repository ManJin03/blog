<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ManJin 的个人主页</title>
  <meta name="description" content="ManJin 的个人主页 —— 西安交通大学大三在读，记录日常想法与动态。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8dff'/%3E%3Cstop offset='1' stop-color='%232f6bed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='%23fff' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="page">
    <!-- 个人资料卡片 -->
    <header class="profile-card">
      <div class="avatar" aria-hidden="true">MJ</div>
      <div class="profile-info">
        <h1>ManJin</h1>
        <p class="bio">学生 · 西安交通大学大三在读</p>
        <div class="tags">
          <span class="tag">C/C++</span>
          <span class="tag">Linux</span>
        </div>
      </div>
      <button id="authBtn" class="auth-btn" type="button" title="站长登录后可发布动态">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span id="authBtnText">登录</span>
      </button>
    </header>

    <!-- 发帖框（登录后显示） -->
    <section id="composer" class="composer hidden" aria-label="发布动态">
      <textarea id="postInput" placeholder="分享此刻的想法…" maxlength="500" rows="3"></textarea>
      <div class="composer-bar">
        <span id="charCount" class="char-count">0/500</span>
        <button id="postBtn" class="publish-btn" type="button" disabled>发布</button>
      </div>
    </section>

    <!-- 动态流 -->
    <main class="feed">
      <div class="feed-header">
        <h2>我的动态</h2>
        <span id="postCount" class="feed-count"></span>
      </div>
      <div id="emptyState" class="empty hidden">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>还没有动态，发布第一条想法吧</p>
      </div>
      <ul id="postList" class="post-list"></ul>
    </main>

    <footer class="footer">© 2026 ManJin · Powered by Cloudflare Pages</footer>
  </div>

  <!-- 登录弹窗 -->
  <div id="loginModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="站长登录">
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <h3>站长登录</h3>
      <p class="modal-tip">仅站长本人可以发布和删除动态</p>
      <form id="loginForm">
        <input id="passwordInput" type="password" placeholder="请输入密码" autocomplete="current-password" required />
        <p id="loginError" class="login-error hidden"></p>
        <button id="loginBtn" class="publish-btn full" type="submit">登录</button>
      </form>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
